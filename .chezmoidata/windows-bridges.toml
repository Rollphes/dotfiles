path = ".config/wezterm"
kind = "dir"
allowMissingTarget = false

[[msys2.bridgesTo.windows]]
path = ".agents"
kind = "dir"
allowMissingTarget = false

[[msys2.bridgesTo.windows]]
path = ".claude"
kind = "dir"
allowMissingTarget = false

[[msys2.bridgesTo.windows]]
path = ".codex"
kind = "dir"
allowMissingTarget = false

[[msys2.bridgesTo.windows]]
path = ".claude.json"
kind = "file"
allowMissingTarget = false

[[msys2.bridgesTo.windows]]
path = ".gitconfig"
kind = "file"
allowMissingTarget = false

[[msys2.bridgesTo.windows]]
path = ".npmrc"
kind = "file"
allowMissingTarget = false

[[windows.bridgesTo.msys2]]
path = "AppData/Local/Microsoft/PowerShell/StartupProfileData-NonInteractive"
kind = "file"
allowMissingTarget = true

[[windows.bridgesTo.msys2]]
path = "AppData/Local/Microsoft/PowerShell/telemetry.uuid"
kind = "file"
allowMissingTarget = true
