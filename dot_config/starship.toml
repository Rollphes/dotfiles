"$schema" = 'https://starship.rs/config-schema.json'

format = """
[ $os ](bg:#3a4a6a fg:#ffffff)\
$username\
$hostname\
$container\
[](bg:#3a3a3a fg:#3a4a6a)\
$directory\
[](fg:#3a3a3a bg:#addc10)\
$git_branch\
$git_commit\
$git_state\
$git_status\
[](fg:#addc10 bg:#2d3748)\
$nodejs\
${custom.typescript}\
$rust\
$golang\
$php\
[](fg:#2d3748)\
\n$character"""

right_format = "$cmd_duration"

[os]
disabled = false
format = "$symbol"

[os.symbols]
Windows = ""
Macos = ""
Linux = ""
Ubuntu = ""
CentOS = ""

[username]
style_root = "bold fg:#ff8961 bg:#3a4a6a"
style_user = "bold fg:#ffffff bg:#3a4a6a"
show_always = true
detect_env_vars = ['!TMUX', 'SSH_CONNECTION']
format = '[$user ]($style)'

[hostname]
ssh_symbol = ""
ssh_only = false
detect_env_vars = ['!TMUX', 'SSH_CONNECTION']
style = "fg:#ffffff bg:#3a4a6a"
format = '[via $ssh_symbol ($hostname) ]($style)'

[container]
symbol = ""
style = "fg:#ffffff bg:#3a4a6a"
format = '[in $symbol ($name) ]($style)'

[directory]
style = "fg:#ffffff bg:#3a3a3a"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = ""
"Pictures" = ""

[git_branch]
symbol = ""
style = "fg:#1a3a01 bg:#addc10"
format = '[ $symbol $branch ]($style)'

[git_commit]
only_detached = true
commit_hash_length = 7
tag_disabled = false
tag_symbol = ""
style = "fg:#1a3a01 bg:#addc10"
format = '[\($hash$tag\) ]($style)'

[git_state]
style = "fg:#5d2e0a bg:#addc10"
format = '[\($state( $progress_current/$progress_total)\) ]($style)'
rebase = "REBASE"
merge = "MERGE"
revert = "REVERT"
cherry_pick = "PICK"
bisect = "BISECT"
am = "AM"
am_or_rebase = "AM/REBASE"

[git_status]
style = "fg:#1a3a01 bg:#addc10"
format = '[$all_status$ahead_behind ]($style)'

conflicted = '[=](fg:#b71c1c bg:#addc10)'
modified   = '[*](fg:#b71c1c bg:#addc10)'
deleted    = '[✗](fg:#b71c1c bg:#addc10)'
staged     = '[~](fg:#5d2e0a bg:#addc10)'
untracked  = '[…](fg:#1a3a5e bg:#addc10)'
stashed    = '[\$](fg:#5e548e bg:#addc10)'
renamed    = '[»](fg:#1a3a5e bg:#addc10)'
ahead      = '[+${count}](fg:#1a3a01 bg:#addc10)'
behind     = '[-${count}](fg:#5d2e0a bg:#addc10)'
diverged   = '[±+${ahead_count}-${behind_count}](fg:#b71c1c bg:#addc10)'
up_to_date = ''

[nodejs]
symbol = ""
style = "bg:#2d3748"
format = '[[ $symbol ($version) ](fg:#addc10 bg:#2d3748)]($style)'

[custom.typescript]
symbol = "󰛦"
style = "bg:#2d3748"
shell = ["sh"]
detect_files = ['tsconfig.json']
format = '[[ $symbol ($output) ](fg:#addc10 bg:#2d3748)]($style)'
ignore_timeout = true
command = '''v=$(grep -m1 '"version"' node_modules/typescript/package.json | grep -oP '[\d.]+' | tr -d '\r'); cache=/tmp/starship_ts_$v; if [ ! -f "$cache" ]; then rm -f /tmp/starship_ts_*; echo "v$v" > "$cache"; fi; cat "$cache"'''

[rust]
symbol = ""
style = "bg:#2d3748"
format = '[[ $symbol ($version) ](fg:#addc10 bg:#2d3748)]($style)'

[golang]
symbol = ""
style = "bg:#2d3748"
format = '[[ $symbol ($version) ](fg:#addc10 bg:#2d3748)]($style)'

[php]
symbol = ""
style = "bg:#2d3748"
format = '[[ $symbol ($version) ](fg:#addc10 bg:#2d3748)]($style)'


[cmd_duration]
min_time = 100
show_milliseconds = true
format = "[ $duration](fg:#888888)"
