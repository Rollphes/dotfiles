name: Dotfiles

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    name: Apply (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Bootstrap Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git openssh-client
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- \
            -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Bootstrap macOS
        if: runner.os == 'macOS'
        shell: bash
        run: brew install chezmoi

      - name: Prepare Windows contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msysHome = "C:\msys64\home\$env:USERNAME"
          $cargoHome = "$msysHome\.cargo"
          $rustupHome = "$msysHome\.rustup"
          $xdgConfigHome = "$msysHome\.config"
          $xdgDataHome = "$msysHome\.local\share"
          $xdgStateHome = "$msysHome\.local\state"
          $xdgCacheHome = "$msysHome\.cache"
          $msysTemp = 'C:\msys64\tmp'
          New-Item -ItemType Directory -Force -Path $msysHome, $msysTemp | Out-Null
          "HOME=$msysHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CARGO_HOME=$cargoHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RUSTUP_HOME=$rustupHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "XDG_CONFIG_HOME=$xdgConfigHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "XDG_DATA_HOME=$xdgDataHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "XDG_STATE_HOME=$xdgStateHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "XDG_CACHE_HOME=$xdgCacheHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEMP=$msysTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$msysTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GHQ_ROOT=$msysHome\ghq" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MISE_CONFIG_DIR=$xdgConfigHome\mise" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MISE_DATA_DIR=$xdgDataHome\mise" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MISE_STATE_DIR=$xdgStateHome\mise" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MISE_CACHE_DIR=$xdgCacheHome\mise" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MISE_TMP_DIR=$xdgCacheHome\mise\tmp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AUBE_CACHE_DIR=$xdgCacheHome\aube" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AUBE_STORE_DIR=$xdgDataHome\aube\store" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ATUIN_CONFIG_DIR=$xdgConfigHome\atuin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "UV_CACHE_DIR=$xdgCacheHome\uv" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "UV_TOOL_DIR=$xdgDataHome\uv\tools" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "UV_PYTHON_INSTALL_DIR=$xdgDataHome\uv\python" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "_ZO_DATA_DIR=$xdgDataHome\zoxide" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          'MSYSTEM=UCRT64' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          'C:\msys64\ucrt64\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          'C:\msys64\usr\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$msysHome\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$cargoHome\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          $developerMode = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $developerMode -Force | Out-Null
          New-ItemProperty `
            -Path $developerMode `
            -Name AllowDevelopmentWithoutDevLicense `
            -PropertyType DWord `
            -Value 1 `
            -Force | Out-Null

          foreach ($relativePath in @(
            '.config\wezterm',
            '.agents',
            '.claude',
            '.codex',
            '.claude.json',
            '.gitconfig',
            '.npmrc'
          )) {
            $path = Join-Path $env:USERPROFILE $relativePath
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force
            }
          }

      - name: Install Windows bootstrap packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & 'C:\msys64\usr\bin\bash.exe' -lc @'
          pacman -Sy --needed --noconfirm \
            fish \
            mingw-w64-ucrt-x86_64-curl \
            mingw-w64-ucrt-x86_64-git \
            openssh \
            unzip
          '@
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install chezmoi and mise on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          & 'C:\msys64\usr\bin\bash.exe' -lc @'
          mkdir -p "$HOME/.local/bin"
          curl -fsLS https://get.chezmoi.io | sh -s -- -b "$HOME/.local/bin"
          '@
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $release = gh api repos/jdx/mise/releases/latest | ConvertFrom-Json
          $asset = @(
            $release.assets | Where-Object name -Match '^mise-v[0-9.]+-windows-x64\.zip$'
          )
          if ($asset.Count -ne 1) {
            throw "Expected one mise Windows asset, found $($asset.Count)"
          }

          $archive = Join-Path $env:RUNNER_TEMP 'mise.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'mise'
          Invoke-WebRequest -Uri $asset[0].browser_download_url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          foreach ($name in 'mise.exe', 'mise-shim.exe') {
            $binary = Get-ChildItem -LiteralPath $extract -Recurse -Filter $name -File
            if ($binary.Count -ne 1) {
              throw "Expected one $name, found $($binary.Count)"
            }
            Copy-Item $binary.FullName (Join-Path "$env:HOME\.local\bin" $name)
          }

      - name: Initialize and apply
        if: runner.os != 'Windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chezmoi --source "$GITHUB_WORKSPACE" init --apply --no-tty

      - name: Start Windows first-apply leakage audit
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $auditScript = Join-Path $env:RUNNER_TEMP 'windows-leakage-audit.ps1'
          chezmoi `
            --source $env:GITHUB_WORKSPACE `
            execute-template `
            --file .\dot_local\bin\executable_audit.ps1.tmpl `
            --output $auditScript
          & $auditScript `
            start `
            -StateRoot "$env:HOME\.local\state\dotfiles-leakage-ci\first"

      - name: Initialize and apply on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chezmoi --source $env:GITHUB_WORKSPACE init --apply --no-tty

      - name: Report Windows first-apply leakage
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $auditScript = Join-Path $env:RUNNER_TEMP 'windows-leakage-audit.ps1'
          & $auditScript `
            stop `
            -StateRoot "$env:HOME\.local\state\dotfiles-leakage-ci\first"
          & $auditScript `
            report `
            -StateRoot "$env:HOME\.local\state\dotfiles-leakage-ci\first"
          & .github/scripts/verify-windows-containment.ps1 `
            -StateRoot "$env:HOME\.local\state\dotfiles-leakage-ci\first"

      - name: Verify managed contracts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$HOME/.cargo/bin:$PATH"

          [[ "$(chezmoi --source "$GITHUB_WORKSPACE" target-path)" == "$HOME" ]]
          git lfs version
          mise --version
          ghq --version
          [[ "$(ghq root)" == "$HOME/ghq" ]]
          [[ "$(ghq root --all)" == "$HOME/ghq" ]]
          rustup show active-toolchain
          bash .github/scripts/verify-fonts.sh

          second_apply="$(chezmoi --source "$GITHUB_WORKSPACE" apply --no-tty)"
          printf '%s\n' "$second_apply"
          [[ "$(grep -c 'already installed' <<< "$second_apply")" -eq 2 ]]

          diff="$(chezmoi --source "$GITHUB_WORKSPACE" diff --no-pager --exclude scripts)"
          [[ -z "$diff" ]]
          [[ -z "$(git status --porcelain)" ]]

      - name: Verify managed contracts on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = @(
            "$env:HOME\.local\bin",
            "$env:HOME\.local\share\mise\shims",
            "$env:CARGO_HOME\bin",
            $env:PATH
          ) -join ';'

          $targetPath = [IO.Path]::GetFullPath(
            (chezmoi --source $env:GITHUB_WORKSPACE target-path)
          )
          if ($targetPath -ne [IO.Path]::GetFullPath($env:HOME)) {
            throw "Unexpected chezmoi destination: $targetPath"
          }

          git lfs version
          mise --version
          rustup show active-toolchain
          & .github/scripts/verify-fonts.ps1

          $rustupCommand = Get-Command rustup -CommandType Application |
            Select-Object -First 1
          $expectedRustup = [IO.Path]::GetFullPath("$env:CARGO_HOME\bin\rustup.exe")
          if ([IO.Path]::GetFullPath($rustupCommand.Source) -ne $expectedRustup) {
            throw "Unexpected rustup executable: $($rustupCommand.Source)"
          }

          $rustupHome = rustup show home
          if (
            [IO.Path]::GetFullPath($rustupHome) -ne
            [IO.Path]::GetFullPath($env:RUSTUP_HOME)
          ) {
            throw "Rust escaped the MSYS2 home: $rustupHome"
          }

          $fishConfigHome = (
            & 'C:\msys64\usr\bin\cygpath.exe' -u $env:XDG_CONFIG_HOME
          ).Trim()
          $fishEnvironment = @(
            & 'C:\msys64\usr\bin\env.exe' `
              "XDG_CONFIG_HOME=$fishConfigHome" `
              'C:\msys64\usr\bin\fish.exe' `
              -c @'
          printf '%s\n' "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME" "$XDG_CACHE_HOME" "$APPDATA" "$LOCALAPPDATA" "$TEMP" "$TMP" "$GHQ_ROOT" "$MISE_CONFIG_DIR" "$MISE_DATA_DIR" "$MISE_STATE_DIR" "$MISE_CACHE_DIR" "$MISE_TMP_DIR" "$AUBE_CACHE_DIR" "$AUBE_STORE_DIR" "$ATUIN_CONFIG_DIR" "$UV_CACHE_DIR" "$UV_TOOL_DIR" "$UV_PYTHON_INSTALL_DIR" "$_ZO_DATA_DIR"
          '@
          )
          $emptyEnvironment = @(
            $fishEnvironment | Where-Object { [string]::IsNullOrWhiteSpace($_) }
          )
          if ($fishEnvironment.Count -ne 21 -or $emptyEnvironment.Count -ne 0) {
            throw "Unexpected Fish environment output: $($fishEnvironment.Count) values"
          }
          $expectedEnvironment = @(
            "$env:HOME\.config",
            "$env:HOME\.local\share",
            "$env:HOME\.local\state",
            "$env:HOME\.cache",
            "$env:HOME\.winprofile\AppData\Roaming",
            "$env:HOME\.winprofile\AppData\Local",
            'C:\msys64\tmp',
            'C:\msys64\tmp',
            "$env:HOME\ghq",
            "$env:HOME\.config\mise",
            "$env:HOME\.local\share\mise",
            "$env:HOME\.local\state\mise",
            "$env:HOME\.cache\mise",
            "$env:HOME\.cache\mise\tmp",
            "$env:HOME\.cache\aube",
            "$env:HOME\.local\share\aube\store",
            "$env:HOME\.config\atuin",
            "$env:HOME\.cache\uv",
            "$env:HOME\.local\share\uv\tools",
            "$env:HOME\.local\share\uv\python",
            "$env:HOME\.local\share\zoxide"
          ) | ForEach-Object { [IO.Path]::GetFullPath($_) }
          $actualEnvironment = $fishEnvironment | ForEach-Object {
            [IO.Path]::GetFullPath(
              (& 'C:\msys64\usr\bin\cygpath.exe' -w $_)
            )
          }
          if (Compare-Object $expectedEnvironment $actualEnvironment) {
            throw 'Fish environment escaped the MSYS2 home quarantine'
          }

          $ghqRoot = [IO.Path]::GetFullPath((ghq root).Trim())
          $expectedGhqRoot = [IO.Path]::GetFullPath("$env:HOME\ghq")
          if (-not $ghqRoot.Equals($expectedGhqRoot, [StringComparison]::OrdinalIgnoreCase)) {
            throw "ghq escaped the MSYS2 home: $ghqRoot"
          }
          $ghqRoots = @(ghq root --all)
          if (
            $ghqRoots.Count -ne 1 -or
            -not [IO.Path]::GetFullPath($ghqRoots[0].Trim()).Equals(
              $expectedGhqRoot,
              [StringComparison]::OrdinalIgnoreCase
            )
          ) {
            throw "Unexpected ghq roots: $($ghqRoots -join ', ')"
          }

          $miseData = [IO.Path]::GetFullPath("$env:HOME\.local\share\mise")
          if (-not (Test-Path -LiteralPath $miseData -PathType Container)) {
            throw "mise data is missing from the MSYS2 home: $miseData"
          }

          foreach ($relativePath in '.gitconfig', '.config\wezterm') {
            $linkPath = Join-Path $env:USERPROFILE $relativePath
            $expected = Join-Path $env:HOME $relativePath
            $link = Get-Item -LiteralPath $linkPath -Force
            if ($link.LinkType -ne 'SymbolicLink') {
              throw "Bridge is not a symbolic link: $linkPath"
            }
            $resolvedTarget = $link.ResolveLinkTarget($false)
            if ($null -eq $resolvedTarget) {
              throw "Unable to resolve bridge target: $linkPath"
            }
            $actual = [IO.Path]::GetFullPath($resolvedTarget.FullName).TrimEnd(
              [IO.Path]::DirectorySeparatorChar,
              [IO.Path]::AltDirectorySeparatorChar
            )
            $expected = [IO.Path]::GetFullPath($expected).TrimEnd(
              [IO.Path]::DirectorySeparatorChar,
              [IO.Path]::AltDirectorySeparatorChar
            )
            if (-not [string]::Equals(
              $actual,
              $expected,
              [StringComparison]::OrdinalIgnoreCase
            )) {
              throw "Unexpected bridge target: $linkPath -> $actual"
            }
          }

          $secondAuditState = "$env:HOME\.local\state\dotfiles-leakage-ci\second"
          $auditScript = Join-Path $env:RUNNER_TEMP 'windows-leakage-audit.ps1'
          & $auditScript `
            start `
            -StateRoot $secondAuditState

          $secondApply = @()
          $secondApplyExitCode = 0
          $secondApplyError = $null
          $auditError = $null
          try {
            $secondApply = chezmoi --source $env:GITHUB_WORKSPACE apply --no-tty
            $secondApplyExitCode = $LASTEXITCODE
          } catch {
            $secondApplyError = $_
          } finally {
            try {
              & $auditScript `
                stop `
                -StateRoot $secondAuditState
              & $auditScript `
                report `
                -StateRoot $secondAuditState
              & .github/scripts/verify-windows-containment.ps1 `
                -StateRoot $secondAuditState
            } catch {
              $auditError = $_
            }
          }

          $secondApply
          if ($null -ne $secondApplyError) { throw $secondApplyError }
          if ($secondApplyExitCode -ne 0) { exit $secondApplyExitCode }
          if ($null -ne $auditError) { throw $auditError }

          if (@($secondApply | Select-String -SimpleMatch 'already installed').Count -ne 2) {
            throw 'Second apply reinstalled a managed font'
          }

          $diff = chezmoi `
            --source $env:GITHUB_WORKSPACE `
            diff `
            --no-pager `
            --exclude scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($diff) { throw "chezmoi diff is not empty`n$diff" }
          if (git status --porcelain) { throw 'Source tree is not clean' }
