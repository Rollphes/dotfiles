name: Dotfiles

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    name: Apply (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Bootstrap Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y curl git openssh-client
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- \
            -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Bootstrap macOS
        if: runner.os == 'macOS'
        shell: bash
        run: brew install chezmoi

      - name: Prepare Windows contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Capture host authority once, before process profile virtualization.
          $hostProfile = $env:USERPROFILE
          $hostLocalAppData = $env:LOCALAPPDATA
          $hostRoamingAppData = $env:APPDATA
          # Runner TEMP uses an 8.3 alias; use the equivalent long path so the
          # Local snapshot can exclude the independently monitored Temp root.
          $hostTemp = Join-Path $hostLocalAppData 'Temp'
          "DOTFILES_CI_HOST_PROFILE=$hostProfile" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DOTFILES_CI_HOST_LOCALAPPDATA=$hostLocalAppData" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DOTFILES_CI_HOST_APPDATA=$hostRoamingAppData" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "DOTFILES_CI_HOST_TEMP=$hostTemp" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $msysHome = "C:\msys64\home\$env:USERNAME"
          $cargoHome = "$msysHome\.cargo"
          $msysTemp = 'C:\msys64\tmp'
          New-Item -ItemType Directory -Force -Path $msysHome, $msysTemp | Out-Null
          # Keep runner shells on the real host profile. Each Windows step enters
          # the development contract only after PowerShell has finished startup.
          "DOTFILES_CI_DEVELOPMENT_HOME=$msysHome" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'C:\msys64\ucrt64\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          'C:\msys64\usr\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$msysHome\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$cargoHome\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          # The runner must already permit symlinks. Never alter registry or
          # remove conflicting host resources to make bridge checks pass.

      - name: Install Windows bootstrap packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . .github/scripts/set-windows-development-environment.ps1
          & 'C:\msys64\usr\bin\bash.exe' -lc @'
          pacman -Sy --needed --noconfirm \
            fish \
            mingw-w64-ucrt-x86_64-curl \
            mingw-w64-ucrt-x86_64-git \
            openssh \
            unzip
          '@
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install chezmoi and mise on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . .github/scripts/set-windows-development-environment.ps1
          & 'C:\msys64\usr\bin\bash.exe' -lc @'
          mkdir -p "$HOME/.local/bin"
          curl -fsLS https://get.chezmoi.io | sh -s -- -b "$HOME/.local/bin"
          '@
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $release = gh api repos/jdx/mise/releases/latest | ConvertFrom-Json
          $asset = @(
            $release.assets | Where-Object name -Match '^mise-v[0-9.]+-windows-x64\.zip$'
          )
          if ($asset.Count -ne 1) {
            throw "Expected one mise Windows asset, found $($asset.Count)"
          }

          $archive = Join-Path $env:TEMP 'mise-bootstrap.zip'
          $extract = Join-Path $env:TEMP 'mise-bootstrap'
          Invoke-WebRequest -Uri $asset[0].browser_download_url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          foreach ($name in 'mise.exe', 'mise-shim.exe') {
            $binary = @(
              Get-ChildItem -LiteralPath $extract -Recurse -Filter $name -File
            )
            if ($binary.Count -ne 1) {
              throw "Expected one $name, found $($binary.Count)"
            }
            Copy-Item $binary.FullName (Join-Path "$env:HOME\.local\bin" $name)
          }

      - name: Initialize and apply
        if: runner.os != 'Windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chezmoi --source "$GITHUB_WORKSPACE" init --apply --no-tty

      - name: Start Windows first-apply leakage audit
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . .github/scripts/set-windows-development-environment.ps1
          $auditScript = Join-Path $env:TEMP 'windows-leakage-audit.ps1'
          chezmoi `
            --source $env:GITHUB_WORKSPACE `
            execute-template `
            --file .\dot_local\bin\executable_audit.ps1.tmpl `
            --output $auditScript
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .github/scripts/test-windows-containment.ps1 -AuditScript $auditScript
          & $auditScript `
            start `
            -HostProfile $env:DOTFILES_CI_HOST_PROFILE `
            -HostTemp $env:DOTFILES_CI_HOST_TEMP `
            -HostLocalAppData $env:DOTFILES_CI_HOST_LOCALAPPDATA `
            -HostRoamingAppData $env:DOTFILES_CI_HOST_APPDATA `
            -WorkspaceRoots $env:GITHUB_WORKSPACE `
            -StateRoot "$env:HOME\.local\state\dotfiles-leakage-ci\first"

      - name: Initialize and apply on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . .github/scripts/set-windows-development-environment.ps1
          chezmoi --source $env:GITHUB_WORKSPACE init --no-tty
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $configPath = Join-Path $env:XDG_CONFIG_HOME 'chezmoi\chezmoi.toml'
          if (-not (Test-Path -LiteralPath $configPath -PathType Leaf)) {
            throw "chezmoi config is missing: $configPath"
          }

          # This apply belongs to the development process tree. Keep the
          # canonical profile contract inherited by chezmoi itself and its children.
          chezmoi `
            --config $configPath `
            --source $env:GITHUB_WORKSPACE `
            apply `
            --no-tty
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Probe Windows development runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . .github/scripts/set-windows-development-environment.ps1
          # This runner PowerShell started with the host profile. Entering the
          # development contract after startup avoids its hard-coded AppData cache.
          & .github/scripts/probe-windows-runtime.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report Windows first-apply leakage
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          . .github/scripts/set-windows-development-environment.ps1
          $auditScript = Join-Path $env:TEMP 'windows-leakage-audit.ps1'
          if (Test-Path -LiteralPath $auditScript -PathType Leaf) {
            try {
              & $auditScript stop -StateRoot "$env:HOME\.local\state\dotfiles-leakage-ci\first"
            } finally {
              & $auditScript report -StateRoot "$env:HOME\.local\state\dotfiles-leakage-ci\first"
            }
            & .github/scripts/verify-windows-containment.ps1 `
              -StateRoot "$env:HOME\.local\state\dotfiles-leakage-ci\first"
          } else {
            Write-Output 'Windows leakage audit did not start; no report is available.'
          }

      - name: Verify managed contracts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$HOME/.cargo/bin:$PATH"

          [[ "$(chezmoi --source "$GITHUB_WORKSPACE" target-path)" == "$HOME" ]]
          git lfs version
          mise --version
          ghq --version
          [[ "$(ghq root)" == "$HOME/ghq" ]]
          [[ "$(ghq root --all)" == "$HOME/ghq" ]]
          rustup show active-toolchain
          bash .github/scripts/verify-fonts.sh

          second_apply="$(chezmoi --source "$GITHUB_WORKSPACE" apply --no-tty)"
          printf '%s\n' "$second_apply"
          [[ "$(grep -c 'already installed' <<< "$second_apply")" -eq 2 ]]

          diff="$(chezmoi --source "$GITHUB_WORKSPACE" diff --no-pager --exclude scripts)"
          [[ -z "$diff" ]]
          [[ -z "$(git status --porcelain)" ]]

      - name: Verify managed contracts on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . .github/scripts/set-windows-development-environment.ps1
          & .github/scripts/verify-windows-managed-contracts.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows leakage audit
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-leakage-audit
          path: ${{ env.DOTFILES_CI_DEVELOPMENT_HOME }}/.local/state/dotfiles-leakage-ci
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
